<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FNF Engine Remake</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #editor-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
    }
    #editor-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .editor-header {
      padding: 12px 20px;
      background: #111;
      border-bottom: 2px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .editor-title {
      font-size: 18px;
      color: #00ffcc;
      font-weight: bold;
    }
    .editor-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button, label.btn, select {
      background: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      border-radius: 4px;
    }
    button:hover, label.btn:hover, select:hover {
      background: #333;
      border-color: #00ffcc;
    }
    input[type="file"] {
      display: none;
    }
    .editor-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    #chart-canvas-container {
      flex: 1;
      height: 100%;
      position: relative;
    }
    .editor-sidebar {
      width: 250px;
      background: #111;
      border-left: 1px solid #333;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .control-group label {
      font-size: 12px;
      color: #aaa;
    }
    .control-group input, .control-group select {
      background: #000;
      border: 1px solid #444;
      color: #fff;
      padding: 6px;
      font-family: inherit;
      border-radius: 3px;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .checkbox-group label {
      font-size: 13px;
      color: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="editor-overlay">
    <div class="editor-header">
      <div class="editor-title">CHART EDITOR (Press 7 to Exit)</div>
      <div class="editor-controls">
        <button id="btn-play">Play / Pause</button>
        <button id="btn-clear">Clear All</button>
        <button id="btn-save-local">Save to Local Disk</button>
        <button id="btn-export">Export JSON</button>
        <label class="btn">
          Import Song / JSON
          <input type="file" id="json-input" accept=".json,.fnfsong">
        </label>
      </div>
    </div>
    <div class="editor-body">
      <div id="chart-canvas-container">
        <canvas id="editorCanvas"></canvas>
      </div>
      <div class="editor-sidebar">
        <div class="control-group">
          <label for="input-bpm">BPM</label>
          <input type="number" id="input-bpm" value="120" min="30" max="400">
        </div>
        <div class="control-group">
          <label for="input-scroll">Scroll Speed</label>
          <input type="number" id="input-scroll" value="2.0" step="0.1" min="0.5" max="10">
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="check-downscroll">
          <label for="check-downscroll">Downscroll</label>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="check-fallback" checked>
          <label for="check-fallback">Use Canvas Notes</label>
        </div>
        <div style="font-size: 11px; color: #777; margin-top: auto; line-height: 1.4;">
          <p>Controls:</p>
          <p>- Left Click: Place Note</p>
          <p>- Right Click: Remove Note</p>
          <p>- Mouse Wheel: Scroll Chart</p>
          <p>- Spacebar: Toggle Playback</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const XML_DATA = `<?xml version="1.0" encoding="UTF-8"?>
<TextureAtlas imagePath="noteStrumline.png" width="2019" height="810">
  <SubTexture name="confirmDown0001" x="218" y="358" width="226" height="224" frameX="-2" frameY="-2" frameWidth="235" frameHeight="230" />
  <SubTexture name="confirmDown0002" x="444" y="364" width="226" height="224" frameX="-2" frameY="-2" frameWidth="235" frameHeight="230" />
  <SubTexture name="confirmDown0003" x="0" y="141" width="210" height="210" frameX="-10" frameY="-9" frameWidth="235" frameHeight="230" />
  <SubTexture name="confirmDown0004" x="0" y="141" width="210" height="210" frameX="-10" frameY="-9" frameWidth="235" frameHeight="230" />
  <SubTexture name="confirmLeft0001" x="1564" y="424" width="226" height="228" frameX="-2" frameY="-2" frameWidth="232" frameHeight="236" />
  <SubTexture name="confirmLeft0002" x="1287" y="157" width="216" height="218" frameX="-7" frameY="-7" frameWidth="232" frameHeight="236" />
  <SubTexture name="confirmLeft0003" x="1070" y="154" width="217" height="217" frameX="-6" frameY="-8" frameWidth="232" frameHeight="236" />
  <SubTexture name="confirmLeft0004" x="1070" y="154" width="217" height="217" frameX="-6" frameY="-8" frameWidth="232" frameHeight="236" />
  <SubTexture name="confirmRight0001" x="1503" y="157" width="216" height="218" frameX="-6" frameY="-8" frameWidth="233" frameHeight="236" />
  <SubTexture name="confirmRight0002" x="1719" y="206" width="216" height="218" frameX="-6" frameY="-8" frameWidth="233" frameHeight="236" />
  <SubTexture name="confirmRight0003" x="0" y="353" width="218" height="218" frameX="-5" frameY="-8" frameWidth="233" frameHeight="236" />
  <SubTexture name="confirmRight0004" x="0" y="353" width="218" height="218" frameX="-5" frameY="-8" frameWidth="233" frameHeight="236" />
  <SubTexture name="confirmUp0001" x="1790" y="424" width="229" height="228" frameX="-3" frameY="-2" frameWidth="238" frameHeight="235" />
  <SubTexture name="confirmUp0002" x="0" y="582" width="229" height="228" frameX="-3" frameY="-2" frameWidth="238" frameHeight="235" />
  <SubTexture name="confirmUp0003" x="1783" y="0" width="206" height="206" frameX="-14" frameY="-13" frameWidth="238" frameHeight="235" />
  <SubTexture name="confirmUp0004" x="1783" y="0" width="206" height="206" frameX="-14" frameY="-13" frameWidth="238" frameHeight="235" />
  <SubTexture name="pressDown0001" x="0" y="0" width="142" height="139" frameX="-4" frameY="-3" frameWidth="149" frameHeight="146" />
  <SubTexture name="pressDown0002" x="0" y="0" width="142" height="139" frameX="-4" frameY="-3" frameWidth="149" frameHeight="146" />
  <SubTexture name="pressDown0003" x="563" y="0" width="149" height="146" frameX="-0" frameY="-0" frameWidth="149" frameHeight="146" />
  <SubTexture name="pressDown0004" x="563" y="0" width="149" height="146" frameX="-0" frameY="-0" frameWidth="149" frameHeight="146" />
  <SubTexture name="pressLeft0001" x="142" y="0" width="139" height="141" frameX="-4" frameY="-3" frameWidth="146" frameHeight="148" />
  <SubTexture name="pressLeft0002" x="142" y="0" width="139" height="141" frameX="-4" frameY="-3" frameWidth="146" frameHeight="148" />
  <SubTexture name="pressLeft0003" x="712" y="0" width="146" height="148" frameX="-0" frameY="-0" frameWidth="146" frameHeight="148" />
  <SubTexture name="pressLeft0004" x="712" y="0" width="146" height="148" frameX="-0" frameY="-0" frameWidth="146" frameHeight="148" />
  <SubTexture name="pressRight0001" x="281" y="0" width="138" height="141" frameX="-3" frameY="-7" frameWidth="148" frameHeight="151" />
  <SubTexture name="pressRight0002" x="281" y="0" width="138" height="141" frameX="-3" frameY="-7" frameWidth="148" frameHeight="151" />
  <SubTexture name="pressRight0003" x="1011" y="0" width="148" height="151" frameX="-0" frameY="-0" frameWidth="148" frameHeight="151" />
  <SubTexture name="pressRight0004" x="1011" y="0" width="148" height="151" frameX="-0" frameY="-0" frameWidth="148" frameHeight="151" />
  <SubTexture name="pressUp0001" x="419" y="0" width="144" height="141" frameX="-5" frameY="-4" frameWidth="153" frameHeight="150" />
  <SubTexture name="pressUp0002" x="419" y="0" width="144" height="141" frameX="-5" frameY="-4" frameWidth="153" frameHeight="150" />
  <SubTexture name="pressUp0003" x="858" y="0" width="153" height="150" frameX="-0" frameY="-0" frameWidth="153" frameHeight="150" />
  <SubTexture name="pressUp0004" x="858" y="0" width="153" height="150" frameX="-0" frameY="-0" frameWidth="153" frameHeight="150" />
  <SubTexture name="staticDown0001" x="1159" y="0" width="157" height="154" frameX="-37" frameY="-37" frameWidth="235" frameHeight="230" />
  <SubTexture name="staticLeft0001" x="1474" y="0" width="154" height="157" frameX="-37" frameY="-38" frameWidth="232" frameHeight="236" />
  <SubTexture name="staticRight0001" x="1628" y="0" width="155" height="157" frameX="-37" frameY="-40" frameWidth="233" frameHeight="236" />
  <SubTexture name="staticUp0001" x="1316" y="0" width="158" height="154" frameX="-38" frameY="-38" frameWidth="238" frameHeight="235" />
</TextureAtlas>`;

    // ATLAS PARSER
    const frames = {};
    function parseAtlas(xmlString) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlString, "text/xml");
      const subTextures = xmlDoc.getElementsByTagName("SubTexture");
      for (let i = 0; i < subTextures.length; i++) {
        const node = subTextures[i];
        const name = node.getAttribute("name");
        frames[name] = {
          x: parseInt(node.getAttribute("x")),
          y: parseInt(node.getAttribute("y")),
          width: parseInt(node.getAttribute("width")),
          height: parseInt(node.getAttribute("height")),
          frameX: parseInt(node.getAttribute("frameX") || 0),
          frameY: parseInt(node.getAttribute("frameY") || 0),
          frameWidth: parseInt(node.getAttribute("frameWidth") || node.getAttribute("width")),
          frameHeight: parseInt(node.getAttribute("frameHeight") || node.getAttribute("height"))
        };
      }
    }
    parseAtlas(XML_DATA);

    const DIRECTIONS = ['left', 'down', 'up', 'right'];
    const KEY_MAP = {
      'KeyA': 0, 'ArrowLeft': 0,
      'KeyS': 1, 'ArrowDown': 1,
      'KeyW': 2, 'ArrowUp': 2,
      'KeyD': 3, 'ArrowRight': 3
    };

    const NOTE_COLORS = ['#c24b99', '#00ffff', '#12fa05', '#f93939'];

    const gCanvas = document.getElementById('gameCanvas');
    const gCtx = gCanvas.getContext('2d');
    const eCanvas = document.getElementById('editorCanvas');
    const eCtx = eCanvas.getContext('2d');

    let spriteImg = new Image();
    spriteImg.src = 'noteStrumline.png';

    let score = 0;
    let misses = 0;
    let combo = 0;
    let totalHitWeight = 0;
    let totalNotesAttempted = 0;
    let accuracy = 100.0;

    let songTime = 0;
    let bpm = 120;
    let scrollSpeed = 2.0;
    let isEditorOpen = false;
    let isPlaying = true;
    let downscroll = false;
    let forceCanvasNotes = true;
    let lastTimestamp = performance.now();

    // COUNTDOWN STATE SYSTEM
    let countdownStep = 0;
    let countdownTimer = 0;
    const COUNTDOWN_STEP_TIME = 600;

    function startCountdown() {
      countdownStep = 0;
      countdownTimer = COUNTDOWN_STEP_TIME;
      songTime = -COUNTDOWN_STEP_TIME * 4;
      score = 0;
      misses = 0;
      combo = 0;
      totalHitWeight = 0;
      totalNotesAttempted = 0;
      accuracy = 100.0;
      ratingPopups = [];
      notes.forEach(n => {
        n.hit = false;
        n.missed = false;
      });
    }

    function recordRatingAccuracy(weight) {
      totalNotesAttempted++;
      totalHitWeight += weight;
      accuracy = (totalHitWeight / totalNotesAttempted) * 100;
    }

    let ratingPopups = [];

    let notes = [
      { time: 1000, dir: 0, hit: false, missed: false },
      { time: 2000, dir: 1, hit: false, missed: false },
      { time: 2500, dir: 2, hit: false, missed: false },
      { time: 3500, dir: 3, hit: false, missed: false }
    ];

    const strumState = [
      { confirmTimer: 0 },
      { confirmTimer: 0 },
      { confirmTimer: 0 },
      { confirmTimer: 0 }
    ];

    const keyHeld = [false, false, false, false];

    function resizeCanvases() {
      gCanvas.width = window.innerWidth;
      gCanvas.height = window.innerHeight;
      const editorContainer = document.getElementById('chart-canvas-container');
      eCanvas.width = editorContainer.clientWidth;
      eCanvas.height = editorContainer.clientHeight;
    }
    window.addEventListener('resize', resizeCanvases);
    resizeCanvases();

    function drawSpriteFrame(ctx, frameName, centerX, centerY, targetSize = 110) {
      const frame = frames[frameName];
      if (!frame) return;

      const scale = targetSize / Math.max(frame.frameWidth, frame.frameHeight);
      const drawWidth = frame.width * scale;
      const drawHeight = frame.height * scale;

      const drawX = centerX - (frame.frameWidth * scale) / 2 + (frame.frameX * scale);
      const drawY = centerY - (frame.frameHeight * scale) / 2 + (frame.frameY * scale);

      ctx.drawImage(
        spriteImg,
        frame.x, frame.y, frame.width, frame.height,
        drawX, drawY, drawWidth, drawHeight
      );
    }

    function drawCanvasArrow(ctx, dir, centerX, centerY, size = 110, state = 'static') {
      ctx.save();
      ctx.translate(centerX, centerY);

      const angles = [Math.PI, Math.PI / 2, -Math.PI / 2, 0];
      ctx.rotate(angles[dir]);

      ctx.beginPath();
      ctx.moveTo(-size * 0.35, -size * 0.16);
      ctx.lineTo(0, -size * 0.16);
      ctx.lineTo(0, -size * 0.40);
      ctx.lineTo(size * 0.40, 0);
      ctx.lineTo(0, size * 0.40);
      ctx.lineTo(0, size * 0.16);
      ctx.lineTo(-size * 0.35, size * 0.16);
      ctx.closePath();

      if (state === 'confirm') {
        ctx.fillStyle = NOTE_COLORS[dir];
        ctx.shadowColor = NOTE_COLORS[dir];
        ctx.shadowBlur = 18;
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
      } else if (state === 'press') {
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = NOTE_COLORS[dir];
        ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = NOTE_COLORS[dir];
        ctx.stroke();
      }

      ctx.restore();
    }

    function triggerRating(text, color) {
      ratingPopups.push({
        text: text,
        color: color,
        y: 0,
        alpha: 1.0,
        timer: 600
      });
    }

    function updateGame(delta) {
      if (isEditorOpen) return;

      if (isPlaying) {
        songTime += delta;
      }

      if (countdownStep < 4) {
        countdownTimer -= delta;
        if (countdownTimer <= 0) {
          countdownStep++;
          countdownTimer = COUNTDOWN_STEP_TIME;
        }
      }

      for (let i = 0; i < 4; i++) {
        if (strumState[i].confirmTimer > 0) {
          strumState[i].confirmTimer -= delta;
        }
      }

      for (let i = ratingPopups.length - 1; i >= 0; i--) {
        const p = ratingPopups[i];
        p.timer -= delta;
        p.y -= delta * 0.05;
        p.alpha = Math.max(0, p.timer / 600);
        if (p.timer <= 0) {
          ratingPopups.splice(i, 1);
        }
      }

      if (countdownStep >= 3) {
        for (let i = 0; i < notes.length; i++) {
          const n = notes[i];
          
          if (!n.hit && !n.missed && songTime - n.time > 180) {
            n.missed = true;
            misses++;
            combo = 0;
            recordRatingAccuracy(0.0);
            triggerRating('MISS', '#ff3333');
          }
        }
      }
    }

    function renderGame() {
      gCtx.fillStyle = '#000000';
      gCtx.fillRect(0, 0, gCanvas.width, gCanvas.height);

      const noteSize = 110;
      const spacing = 125;
      const totalWidth = spacing * 4;
      const startX = (gCanvas.width - totalWidth) / 2 + spacing / 2;
      const strumY = downscroll ? gCanvas.height - 120 : 120;

      for (let i = 0; i < 4; i++) {
        const dirName = DIRECTIONS[i];
        const capitalizedDir = dirName.charAt(0).toUpperCase() + dirName.slice(1);
        const centerX = startX + i * spacing;

        let state = 'static';
        if (strumState[i].confirmTimer > 0) {
          state = 'confirm';
        } else if (keyHeld[i]) {
          state = 'press';
        }

        const usePng = !forceCanvasNotes && spriteImg.complete && spriteImg.naturalWidth > 0;

        if (usePng) {
          let frameName = `static${capitalizedDir}0001`;
          if (state === 'press') frameName = `press${capitalizedDir}0001`;
          if (state === 'confirm') frameName = `confirm${capitalizedDir}0001`;
          drawSpriteFrame(gCtx, frameName, centerX, strumY, noteSize);
        } else {
          drawCanvasArrow(gCtx, i, centerX, strumY, noteSize, state);
        }
      }

      gCtx.fillStyle = '#ffffff';
      gCtx.font = 'bold 22px "Courier New", monospace';
      gCtx.textAlign = 'left';
      gCtx.textBaseline = 'middle';
      gCtx.fillText(`SCORE: ${score}`, startX + 3.8 * spacing + 20, strumY - 35);
      gCtx.fillText(`MISSES: ${misses}`, startX + 3.8 * spacing + 20, strumY - 10);
      gCtx.fillText(`ACC: ${accuracy.toFixed(1)}%`, startX + 3.8 * spacing + 20, strumY + 15);

      // --- SCROLL DIRECTION LOGIC ---
      for (let i = 0; i < notes.length; i++) {
        const n = notes[i];
        if (n.hit || n.missed) continue;

        const timeDiff = n.time - songTime;
        const centerX = startX + n.dir * spacing;
        let headY;

        if (downscroll) {
          // Downscroll: Receptors are at bottom (strumY). Future notes (timeDiff > 0) start ABOVE at lower Y values and fall DOWNWARD.
          headY = strumY - (timeDiff * scrollSpeed * 0.45);
        } else {
          // Upscroll: Receptors are at top (strumY). Future notes (timeDiff > 0) start BELOW at higher Y values and rise UPWARD.
          headY = strumY + (timeDiff * scrollSpeed * 0.45);
        }

        if (headY > -150 && headY < gCanvas.height + 150) {
          const capitalizedDir = DIRECTIONS[n.dir].charAt(0).toUpperCase() + DIRECTIONS[n.dir].slice(1);
          const usePng = !forceCanvasNotes && spriteImg.complete && spriteImg.naturalWidth > 0;

          if (usePng) {
            const frameName = `static${capitalizedDir}0001`;
            drawSpriteFrame(gCtx, frameName, centerX, headY, noteSize);
          } else {
            drawCanvasArrow(gCtx, n.dir, centerX, headY, noteSize, 'confirm');
          }
        }
      }

      for (let i = 0; i < ratingPopups.length; i++) {
        const p = ratingPopups[i];
        gCtx.save();
        gCtx.globalAlpha = p.alpha;
        gCtx.fillStyle = p.color;
        gCtx.font = '900 36px "Courier New", monospace';
        gCtx.textAlign = 'center';
        gCtx.fillText(p.text, gCanvas.width / 2, strumY + (downscroll ? -100 : 180) + p.y);

        if (combo > 1) {
          gCtx.fillStyle = '#ffffff';
          gCtx.font = 'bold 22px "Courier New", monospace';
          gCtx.fillText(`${combo} COMBO`, gCanvas.width / 2, strumY + (downscroll ? -60 : 220) + p.y);
        }
        gCtx.restore();
      }

      if (countdownStep < 4) {
        gCtx.save();
        const countdownTexts = ["3", "2", "1", "GO!"];
        const countdownColors = ["#00ffff", "#12fa05", "#ffff00", "#ff0055"];
        const countdownAngles = [-0.2, 0.2, -0.2, 0.2];

        const text = countdownTexts[countdownStep];
        const color = countdownColors[countdownStep];
        const angle = countdownAngles[countdownStep];

        const progress = (COUNTDOWN_STEP_TIME - countdownTimer) / COUNTDOWN_STEP_TIME;
        const scale = 1.0 + (1.0 - progress) * 0.4;
        const alpha = Math.min(1.0, (1.0 - progress) * 1.5);

        gCtx.translate(gCanvas.width / 2, gCanvas.height / 2);
        gCtx.rotate(angle);
        gCtx.scale(scale, scale);

        gCtx.globalAlpha = alpha;
        gCtx.fillStyle = color;
        gCtx.shadowColor = color;
        gCtx.shadowBlur = 25;
        gCtx.font = '900 110px "Courier New", monospace';
        gCtx.textAlign = 'center';
        gCtx.textBaseline = 'middle';
        gCtx.fillText(text, 0, 0);

        gCtx.restore();
      }
    }

    let editorScrollY = 0;

    function renderEditor() {
      if (!isEditorOpen) return;

      eCtx.fillStyle = '#0a0a0a';
      eCtx.fillRect(0, 0, eCanvas.width, eCanvas.height);

      const colWidth = 80;
      const rowHeight = 80;
      const gridWidth = colWidth * 4;
      const startX = (eCanvas.width - gridWidth) / 2;

      const totalRows = Math.ceil(eCanvas.height / rowHeight) + 20;

      for (let r = -2; r < totalRows; r++) {
        const y = r * rowHeight - (editorScrollY % rowHeight);
        for (let c = 0; c < 4; c++) {
          const x = startX + c * colWidth;
          const isEven = (r + c) % 2 === 0;
          eCtx.fillStyle = isEven ? '#141414' : '#1d1d1d';
          eCtx.fillRect(x, y, colWidth, rowHeight);
          eCtx.strokeStyle = '#2d2d2d';
          eCtx.lineWidth = 1;
          eCtx.strokeRect(x, y, colWidth, rowHeight);
        }
      }

      eCtx.strokeStyle = '#00ffcc';
      eCtx.lineWidth = 2;
      eCtx.strokeRect(startX, 0, gridWidth, eCanvas.height);

      for (let i = 0; i < notes.length; i++) {
        const n = notes[i];
        const noteY = (n.time / 10) - editorScrollY;
        const centerX = startX + n.dir * colWidth + colWidth / 2;

        if (noteY > -50 && noteY < eCanvas.height + 50) {
          const capitalizedDir = DIRECTIONS[n.dir].charAt(0).toUpperCase() + DIRECTIONS[n.dir].slice(1);
          const usePng = !forceCanvasNotes && spriteImg.complete && spriteImg.naturalWidth > 0;

          if (usePng) {
            const frameName = `static${capitalizedDir}0001`;
            drawSpriteFrame(eCtx, frameName, centerX, noteY, colWidth * 0.8);
          } else {
            drawCanvasArrow(eCtx, n.dir, centerX, noteY, colWidth * 0.8, 'confirm');
          }
        }
      }

      const playheadY = (songTime / 10) - editorScrollY;
      eCtx.strokeStyle = '#ff0055';
      eCtx.lineWidth = 3;
      eCtx.beginPath();
      eCtx.moveTo(startX - 30, playheadY);
      eCtx.lineTo(startX + gridWidth + 30, playheadY);
      eCtx.stroke();
    }

    function loop(timestamp) {
      const delta = timestamp - lastTimestamp;
      lastTimestamp = timestamp;

      updateGame(delta);
      renderGame();
      renderEditor();

      requestAnimationFrame(loop);
    }

    startCountdown();
    requestAnimationFrame(loop);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Digit7') {
        isEditorOpen = !isEditorOpen;
        const overlay = document.getElementById('editor-overlay');
        if (isEditorOpen) {
          overlay.classList.add('active');
        } else {
          overlay.classList.remove('active');
          startCountdown();
        }
        return;
      }

      if (isEditorOpen) {
        if (e.code === 'Space') {
          isPlaying = !isPlaying;
        }
        return;
      }

      const dir = KEY_MAP[e.code];
      if (dir !== undefined) {
        keyHeld[dir] = true;

        if (!e.repeat && countdownStep >= 3) {
          let hitNote = false;
          for (let i = 0; i < notes.length; i++) {
            const n = notes[i];
            if (!n.hit && !n.missed && n.dir === dir) {
              const diff = Math.abs(n.time - songTime);
              if (diff <= 160) {
                n.hit = true;
                hitNote = true;
                strumState[dir].confirmTimer = 160;
                combo++;

                if (diff <= 30) {
                  score += 350;
                  recordRatingAccuracy(1.0);
                  triggerRating('SICK!', '#00ffff');
                } else if (diff <= 65) {
                  score += 200;
                  recordRatingAccuracy(0.8);
                  triggerRating('GOOD', '#12fa05');
                } else if (diff <= 95) {
                  score += 100;
                  recordRatingAccuracy(0.6);
                  triggerRating('MID', '#ffff00');
                } else if (diff <= 125) {
                  score += 50;
                  recordRatingAccuracy(0.4);
                  triggerRating('BAD', '#ff9900');
                } else if (diff <= 145) {
                  score += 25;
                  recordRatingAccuracy(0.2);
                  triggerRating('AWFUL', '#ff5500');
                } else {
                  score += 10;
                  recordRatingAccuracy(0.05);
                  triggerRating('SHIT', '#a64dff');
                }
                break;
              }
            }
          }
        }
      }
    });

    window.addEventListener('keyup', (e) => {
      const dir = KEY_MAP[e.code];
      if (dir !== undefined) {
        keyHeld[dir] = false;
      }
    });

    eCanvas.addEventListener('wheel', (e) => {
      if (!isEditorOpen) return;
      e.preventDefault();
      editorScrollY = Math.max(0, editorScrollY + e.deltaY * 0.5);
    });

    eCanvas.addEventListener('mousedown', (e) => {
      if (!isEditorOpen) return;

      const rect = eCanvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const colWidth = 80;
      const gridWidth = colWidth * 4;
      const startX = (eCanvas.width - gridWidth) / 2;

      if (mouseX >= startX && mouseX <= startX + gridWidth) {
        const dir = Math.floor((mouseX - startX) / colWidth);
        const clickedTime = Math.round((mouseY + editorScrollY) * 10);

        if (e.button === 0) {
          const existing = notes.find(n => n.dir === dir && Math.abs(n.time - clickedTime) < 150);
          if (!existing) {
            notes.push({
              time: clickedTime,
              dir: dir,
              hit: false,
              missed: false
            });
            notes.sort((a, b) => a.time - b.time);
          }
        } else if (e.button === 2) {
          notes = notes.filter(n => !(n.dir === dir && Math.abs(n.time - clickedTime) < 150));
        }
      }
    });

    eCanvas.addEventListener('contextmenu', e => e.preventDefault());

    document.getElementById('check-downscroll').addEventListener('change', (e) => {
      downscroll = e.target.checked;
    });

    document.getElementById('check-fallback').addEventListener('change', (e) => {
      forceCanvasNotes = e.target.checked;
    });

    document.getElementById('json-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            bpm = data.bpm || 120;
            scrollSpeed = data.scrollSpeed || 2.0;
            notes = (data.notes || []).map(n => ({
              time: n.time,
              dir: n.dir,
              hit: false,
              missed: false
            }));
            document.getElementById('input-bpm').value = bpm;
            document.getElementById('input-scroll').value = scrollSpeed;
          } catch(err) {
            alert('Invalid Chart File');
          }
        };
        reader.readAsText(file);
      }
    });

    document.getElementById('btn-save-local').addEventListener('click', () => {
      const songNameInput = prompt("Whats the song name");
      if (!songNameInput || songNameInput.trim() === "") return;

      const songName = songNameInput.trim();
      const songData = {
        songName: songName,
        bpm: bpm,
        scrollSpeed: scrollSpeed,
        notes: notes.map(n => ({ time: n.time, dir: n.dir }))
      };

      const blob = new Blob([JSON.stringify(songData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${songName}.fnfsong`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('btn-export').addEventListener('click', () => {
      const chartData = {
        bpm: bpm,
        scrollSpeed: scrollSpeed,
        notes: notes.map(n => ({ time: n.time, dir: n.dir }))
      };
      const blob = new Blob([JSON.stringify(chartData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const aElem = document.createElement('a');
      aElem.href = url;
      aElem.download = 'chart.json';
      aElem.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      notes = [];
    });

    document.getElementById('btn-play').addEventListener('click', () => {
      isPlaying = !isPlaying;
    });

    document.getElementById('input-bpm').addEventListener('change', (e) => {
      bpm = parseFloat(e.target.value) || 120;
    });

    document.getElementById('input-scroll').addEventListener('change', (e) => {
      scrollSpeed = parseFloat(e.target.value) || 2.0;
    });
  </script>
</body>
</html>
