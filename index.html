<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FNF Minimal Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #miss-counter {
      position: absolute;
      top: 50%;
      left: calc(50% + 260px);
      transform: translateY(-50%);
      font-size: 28px;
      font-weight: bold;
      color: #ff3333;
      text-shadow: 2px 2px 4px #000;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #editor-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 10;
    }
    #editor-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .editor-header {
      padding: 15px 20px;
      background: #111;
      border-bottom: 2px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .editor-title {
      font-size: 20px;
      color: #00ffcc;
      font-weight: bold;
    }
    .editor-controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    button, label.btn {
      background: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 6px 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      border-radius: 4px;
    }
    button:hover, label.btn:hover {
      background: #333;
      border-color: #00ffcc;
    }
    input[type="file"] {
      display: none;
    }
    .editor-body {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }
    #chart-canvas-container {
      flex: 1;
      height: 100%;
      position: relative;
    }
    .editor-sidebar {
      width: 250px;
      background: #111;
      border-left: 1px solid #333;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .control-group label {
      font-size: 12px;
      color: #aaa;
    }
    .control-group input {
      background: #000;
      border: 1px solid #444;
      color: #fff;
      padding: 6px;
      font-family: inherit;
      border-radius: 3px;
    }
    #file-inputs {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 5;
      display: flex;
      gap: 10px;
      background: rgba(0,0,0,0.6);
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #333;
    }
  </style>
</head>
<body>

  <div id="file-inputs">
    <label class="btn">
      Load noteStrumline.png
      <input type="file" id="img-input" accept="image/png">
    </label>
    <label class="btn">
      Load noteStrumline.xml
      <input type="file" id="xml-input" accept=".xml">
    </label>
  </div>

  <div id="canvas-container">
    <canvas id="gameCanvas"></canvas>
  </div>

  <div id="miss-counter">MISSES: 0</div>

  <div id="editor-overlay">
    <div class="editor-header">
      <div class="editor-title">CHART EDITOR (Press 7 to Exit)</div>
      <div class="editor-controls">
        <button id="btn-play">Play / Pause</button>
        <button id="btn-clear">Clear All</button>
        <button id="btn-export">Export JSON</button>
        <label class="btn">
          Import JSON
          <input type="file" id="json-input" accept=".json">
        </label>
      </div>
    </div>
    <div class="editor-body">
      <div id="chart-canvas-container">
        <canvas id="editorCanvas"></canvas>
      </div>
      <div class="editor-sidebar">
        <div class="control-group">
          <label for="input-bpm">BPM</label>
          <input type="number" id="input-bpm" value="120" min="30" max="400">
        </div>
        <div class="control-group">
          <label for="input-scroll">Scroll Speed</label>
          <input type="number" id="input-scroll" value="2.0" step="0.1" min="0.5" max="10">
        </div>
        <div style="font-size: 11px; color: #777; margin-top: auto;">
          <p>Controls:</p>
          <p>- Left Click: Place Note</p>
          <p>- Right Click: Remove Note</p>
          <p>- Mouse Wheel: Scroll Chart</p>
          <p>- Spacebar: Toggle Playback</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const XML_DATA = `<?xml version="1.0" encoding="UTF-8"?>
<TextureAtlas imagePath="noteStrumline.png" width="2019" height="810">
  <SubTexture name="confirmDown0001" x="218" y="358" width="226" height="224" frameX="-2" frameY="-2" frameWidth="235" frameHeight="230" />
  <SubTexture name="confirmDown0002" x="444" y="364" width="226" height="224" frameX="-2" frameY="-2" frameWidth="235" frameHeight="230" />
  <SubTexture name="confirmDown0003" x="0" y="141" width="210" height="210" frameX="-10" frameY="-9" frameWidth="235" frameHeight="230" />
  <SubTexture name="confirmDown0004" x="0" y="141" width="210" height="210" frameX="-10" frameY="-9" frameWidth="235" frameHeight="230" />
  <SubTexture name="confirmHoldDown0001" x="0" y="141" width="210" height="210" frameX="-10" frameY="-9" frameWidth="235" frameHeight="230" />
  <SubTexture name="confirmHoldDown0002" x="0" y="141" width="210" height="210" frameX="-10" frameY="-9" frameWidth="235" frameHeight="230" />
  <SubTexture name="confirmHoldDown0003" x="636" y="148" width="217" height="216" frameX="-7" frameY="-6" frameWidth="235" frameHeight="230" />
  <SubTexture name="confirmHoldDown0004" x="853" y="151" width="217" height="216" frameX="-7" frameY="-6" frameWidth="235" frameHeight="230" />
  <SubTexture name="confirmLeft0001" x="1564" y="424" width="226" height="228" frameX="-2" frameY="-2" frameWidth="232" frameHeight="236" />
  <SubTexture name="confirmLeft0002" x="1287" y="157" width="216" height="218" frameX="-7" frameY="-7" frameWidth="232" frameHeight="236" />
  <SubTexture name="confirmLeft0003" x="1070" y="154" width="217" height="217" frameX="-6" frameY="-8" frameWidth="232" frameHeight="236" />
  <SubTexture name="confirmLeft0004" x="1070" y="154" width="217" height="217" frameX="-6" frameY="-8" frameWidth="232" frameHeight="236" />
  <SubTexture name="confirmHoldLeft0001" x="1070" y="154" width="217" height="217" frameX="-6" frameY="-8" frameWidth="232" frameHeight="236" />
  <SubTexture name="confirmHoldLeft0002" x="1070" y="154" width="217" height="217" frameX="-6" frameY="-8" frameWidth="232" frameHeight="236" />
  <SubTexture name="confirmHoldLeft0003" x="670" y="367" width="223" height="224" frameX="-3" frameY="-4" frameWidth="232" frameHeight="236" />
  <SubTexture name="confirmHoldLeft0004" x="893" y="371" width="223" height="224" frameX="-3" frameY="-4" frameWidth="232" frameHeight="236" />
  <SubTexture name="confirmRight0001" x="1503" y="157" width="216" height="218" frameX="-6" frameY="-8" frameWidth="233" frameHeight="236" />
  <SubTexture name="confirmRight0002" x="1719" y="206" width="216" height="218" frameX="-6" frameY="-8" frameWidth="233" frameHeight="236" />
  <SubTexture name="confirmRight0003" x="0" y="353" width="218" height="218" frameX="-5" frameY="-8" frameWidth="233" frameHeight="236" />
  <SubTexture name="confirmRight0004" x="0" y="353" width="218" height="218" frameX="-5" frameY="-8" frameWidth="233" frameHeight="236" />
  <SubTexture name="confirmHoldRight0001" x="0" y="353" width="218" height="218" frameX="-5" frameY="-8" frameWidth="233" frameHeight="236" />
  <SubTexture name="confirmHoldRight0002" x="0" y="353" width="218" height="218" frameX="-5" frameY="-8" frameWidth="233" frameHeight="236" />
  <SubTexture name="confirmHoldRight0003" x="1116" y="375" width="224" height="224" frameX="-2" frameY="-5" frameWidth="233" frameHeight="236" />
  <SubTexture name="confirmHoldRight0004" x="1340" y="375" width="224" height="224" frameX="-2" frameY="-5" frameWidth="233" frameHeight="236" />
  <SubTexture name="confirmUp0001" x="1790" y="424" width="229" height="228" frameX="-3" frameY="-2" frameWidth="238" frameHeight="235" />
  <SubTexture name="confirmUp0002" x="0" y="582" width="229" height="228" frameX="-3" frameY="-2" frameWidth="238" frameHeight="235" />
  <SubTexture name="confirmUp0003" x="1783" y="0" width="206" height="206" frameX="-14" frameY="-13" frameWidth="238" frameHeight="235" />
  <SubTexture name="confirmUp0004" x="1783" y="0" width="206" height="206" frameX="-14" frameY="-13" frameWidth="238" frameHeight="235" />
  <SubTexture name="confirmHoldUp0001" x="1783" y="0" width="206" height="206" frameX="-14" frameY="-13" frameWidth="238" frameHeight="235" />
  <SubTexture name="confirmHoldUp0002" x="1783" y="0" width="206" height="206" frameX="-14" frameY="-13" frameWidth="238" frameHeight="235" />
  <SubTexture name="confirmHoldUp0003" x="210" y="141" width="213" height="212" frameX="-11" frameY="-10" frameWidth="238" frameHeight="235" />
  <SubTexture name="confirmHoldUp0004" x="423" y="146" width="213" height="212" frameX="-11" frameY="-10" frameWidth="238" frameHeight="235" />
  <SubTexture name="pressDown0001" x="0" y="0" width="142" height="139" frameX="-4" frameY="-3" frameWidth="149" frameHeight="146" />
  <SubTexture name="pressDown0002" x="0" y="0" width="142" height="139" frameX="-4" frameY="-3" frameWidth="149" frameHeight="146" />
  <SubTexture name="pressDown0003" x="563" y="0" width="149" height="146" frameX="-0" frameY="-0" frameWidth="149" frameHeight="146" />
  <SubTexture name="pressDown0004" x="563" y="0" width="149" height="146" frameX="-0" frameY="-0" frameWidth="149" frameHeight="146" />
  <SubTexture name="pressLeft0001" x="142" y="0" width="139" height="141" frameX="-4" frameY="-3" frameWidth="146" frameHeight="148" />
  <SubTexture name="pressLeft0002" x="142" y="0" width="139" height="141" frameX="-4" frameY="-3" frameWidth="146" frameHeight="148" />
  <SubTexture name="pressLeft0003" x="712" y="0" width="146" height="148" frameX="-0" frameY="-0" frameWidth="146" frameHeight="148" />
  <SubTexture name="pressLeft0004" x="712" y="0" width="146" height="148" frameX="-0" frameY="-0" frameWidth="146" frameHeight="148" />
  <SubTexture name="pressRight0001" x="281" y="0" width="138" height="141" frameX="-3" frameY="-7" frameWidth="148" frameHeight="151" />
  <SubTexture name="pressRight0002" x="281" y="0" width="138" height="141" frameX="-3" frameY="-7" frameWidth="148" frameHeight="151" />
  <SubTexture name="pressRight0003" x="1011" y="0" width="148" height="151" frameX="-0" frameY="-0" frameWidth="148" frameHeight="151" />
  <SubTexture name="pressRight0004" x="1011" y="0" width="148" height="151" frameX="-0" frameY="-0" frameWidth="148" frameHeight="151" />
  <SubTexture name="pressUp0001" x="419" y="0" width="144" height="141" frameX="-5" frameY="-4" frameWidth="153" frameHeight="150" />
  <SubTexture name="pressUp0002" x="419" y="0" width="144" height="141" frameX="-5" frameY="-4" frameWidth="153" frameHeight="150" />
  <SubTexture name="pressUp0003" x="858" y="0" width="153" height="150" frameX="-0" frameY="-0" frameWidth="153" frameHeight="150" />
  <SubTexture name="pressUp0004" x="858" y="0" width="153" height="150" frameX="-0" frameY="-0" frameWidth="153" frameHeight="150" />
  <SubTexture name="staticDown0001" x="1159" y="0" width="157" height="154" frameX="-37" frameY="-37" frameWidth="235" frameHeight="230" />
  <SubTexture name="staticLeft0001" x="1474" y="0" width="154" height="157" frameX="-37" frameY="-38" frameWidth="232" frameHeight="236" />
  <SubTexture name="staticRight0001" x="1628" y="0" width="155" height="157" frameX="-37" frameY="-40" frameWidth="233" frameHeight="236" />
  <SubTexture name="staticUp0001" x="1316" y="0" width="158" height="154" frameX="-38" frameY="-38" frameWidth="238" frameHeight="235" />
</TextureAtlas>`;

    // --- SPRITE ATLAS PARSER ---
    const frames = {};
    function parseAtlas(xmlString) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlString, "text/xml");
      const subTextures = xmlDoc.getElementsByTagName("SubTexture");
      for (let i = 0; i < subTextures.length; i++) {
        const node = subTextures[i];
        const name = node.getAttribute("name");
        frames[name] = {
          x: parseInt(node.getAttribute("x")),
          y: parseInt(node.getAttribute("y")),
          width: parseInt(node.getAttribute("width")),
          height: parseInt(node.getAttribute("height")),
          frameX: parseInt(node.getAttribute("frameX") || 0),
          frameY: parseInt(node.getAttribute("frameY") || 0),
          frameWidth: parseInt(node.getAttribute("frameWidth") || node.getAttribute("width")),
          frameHeight: parseInt(node.getAttribute("frameHeight") || node.getAttribute("height"))
        };
      }
    }
    parseAtlas(XML_DATA);

    // --- ENGINE CONSTANTS & SETUP ---
    // Strict Left, Down, Up, Right Order!
    const DIRECTIONS = ['left', 'down', 'up', 'right'];
    const KEY_MAP = {
      'KeyA': 0, 'ArrowLeft': 0,
      'KeyS': 1, 'ArrowDown': 1,
      'KeyW': 2, 'ArrowUp': 2,
      'KeyD': 3, 'ArrowRight': 3
    };

    const gCanvas = document.getElementById('gameCanvas');
    const gCtx = gCanvas.getContext('2d');
    const eCanvas = document.getElementById('editorCanvas');
    const eCtx = eCanvas.getContext('2d');
    const missDisplay = document.getElementById('miss-counter');

    let spriteImg = new Image();
    spriteImg.src = 'noteStrumline.png';

    let misses = 0;
    let songTime = 0;
    let bpm = 120;
    let scrollSpeed = 2.0;
    let isEditorOpen = false;
    let isPlaying = true;
    let lastTimestamp = performance.now();

    // Chart Notes: { time: ms, dir: 0-3 }
    let notes = [
      { time: 1000, dir: 0 },
      { time: 1500, dir: 1 },
      { time: 2000, dir: 2 },
      { time: 2500, dir: 3 },
      { time: 3000, dir: 0 },
      { time: 3250, dir: 1 },
      { time: 3500, dir: 2 },
      { time: 3750, dir: 3 }
    ];

    const strumState = [
      { anim: 'static', timer: 0 },
      { anim: 'static', timer: 0 },
      { anim: 'static', timer: 0 },
      { anim: 'static', timer: 0 }
    ];

    function resizeCanvases() {
      gCanvas.width = window.innerWidth;
      gCanvas.height = window.innerHeight;
      const editorContainer = document.getElementById('chart-canvas-container');
      eCanvas.width = editorContainer.clientWidth;
      eCanvas.height = editorContainer.clientHeight;
    }
    window.addEventListener('resize', resizeCanvases);
    resizeCanvases();

    // --- RENDER HELPERS ---
    function drawSpriteFrame(ctx, frameName, targetX, targetY, scale = 0.7) {
      const frame = frames[frameName];
      if (!frame) return;

      const destW = frame.width * scale;
      const destH = frame.height * scale;
      const offsetX = frame.frameX * scale;
      const offsetY = frame.frameY * scale;

      ctx.drawImage(
        spriteImg,
        frame.x, frame.y, frame.width, frame.height,
        targetX + offsetX, targetY + offsetY, destW, destH
      );
    }

    // Direct Arrow Fallbacks if image not present
    function drawFallbackArrow(ctx, dir, x, y, size = 110, state = 'static') {
      const colors = ['#c24b99', '#00ffff', '#0014ff', '#00ff00'];
      ctx.save();
      ctx.translate(x + size/2, y + size/2);
      const angles = [Math.PI, -Math.PI/2, Math.PI/2, 0];
      ctx.rotate(angles[dir]);

      ctx.fillStyle = state === 'press' ? '#ffffff' : colors[dir];
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = state === 'confirm' ? 6 : 3;

      ctx.beginPath();
      ctx.moveTo(-size*0.3, -size*0.15);
      ctx.lineTo(0, -size*0.15);
      ctx.lineTo(0, -size*0.4);
      ctx.lineTo(size*0.4, 0);
      ctx.lineTo(0, size*0.4);
      ctx.lineTo(0, size*0.15);
      ctx.lineTo(-size*0.3, size*0.15);
      ctx.closePath();

      if (state === 'static') {
        ctx.stroke();
      } else {
        ctx.fill();
        ctx.stroke();
      }
      ctx.restore();
    }

    // --- MAIN GAMEPLAY LOOP ---
    function updateGame(delta) {
      if (isPlaying) {
        songTime += delta;
      }

      // Update strum animations
      for (let i = 0; i < 4; i++) {
        if (strumState[i].timer > 0) {
          strumState[i].timer -= delta;
          if (strumState[i].timer <= 0) {
            strumState[i].anim = 'static';
          }
        }
      }

      // Check missed notes
      for (let i = notes.length - 1; i >= 0; i--) {
        const n = notes[i];
        if (!n.hit && songTime - n.time > 180) {
          n.hit = true;
          misses++;
          missDisplay.innerText = `MISSES: ${misses}`;
        }
      }
    }

    function renderGame() {
      gCtx.fillStyle = '#000000';
      gCtx.fillRect(0, 0, gCanvas.width, gCanvas.height);

      const noteSize = 110;
      const spacing = 120;
      const totalWidth = spacing * 4;
      const startX = (gCanvas.width - totalWidth) / 2 + (spacing - noteSize) / 2;
      const strumY = 80;

      // Render Strumline (Middle of Screen)
      for (let i = 0; i < 4; i++) {
        const dirName = DIRECTIONS[i];
        const capitalizedDir = dirName.charAt(0).toUpperCase() + dirName.slice(1);
        const x = startX + i * spacing;

        const state = strumState[i].anim;
        let frameName = `static${capitalizedDir}0001`;
        if (state === 'press') frameName = `press${capitalizedDir}0001`;
        if (state === 'confirm') frameName = `confirm${capitalizedDir}0001`;

        if (spriteImg.complete && spriteImg.naturalWidth > 0 && frames[frameName]) {
          drawSpriteFrame(gCtx, frameName, x - 25, strumY - 25, 0.65);
        } else {
          drawFallbackArrow(gCtx, i, x, strumY, noteSize, state);
        }
      }

      // Render Scrolling Notes
      for (let i = 0; i < notes.length; i++) {
        const n = notes[i];
        if (n.hit) continue;

        const timeDiff = n.time - songTime;
        const y = strumY + (timeDiff * scrollSpeed * 0.45);

        if (y > -150 && y < gCanvas.height + 150) {
          const x = startX + n.dir * spacing;
          const capitalizedDir = DIRECTIONS[n.dir].charAt(0).toUpperCase() + DIRECTIONS[n.dir].slice(1);
          const frameName = `static${capitalizedDir}0001`;

          if (spriteImg.complete && spriteImg.naturalWidth > 0 && frames[frameName]) {
            drawSpriteFrame(gCtx, frameName, x - 25, y - 25, 0.65);
          } else {
            drawFallbackArrow(gCtx, n.dir, x, y, noteSize, 'confirm');
          }
        }
      }
    }

    // --- CHART EDITOR RENDERER ---
    let editorScrollY = 0;

    function renderEditor() {
      if (!isEditorOpen) return;

      eCtx.fillStyle = '#0a0a0a';
      eCtx.fillRect(0, 0, eCanvas.width, eCanvas.height);

      const gridWidth = 320;
      const colWidth = gridWidth / 4;
      const startX = (eCanvas.width - gridWidth) / 2;
      const rowHeight = 30;

      // Draw Grid Lines
      eCtx.strokeStyle = '#222';
      eCtx.lineWidth = 1;

      const totalRows = Math.ceil(eCanvas.height / rowHeight) + 20;
      for (let r = 0; r < totalRows; r++) {
        const y = r * rowHeight - (editorScrollY % rowHeight);
        eCtx.beginPath();
        eCtx.moveTo(startX, y);
        eCtx.lineTo(startX + gridWidth, y);
        eCtx.stroke();
      }

      for (let c = 0; c <= 4; c++) {
        const x = startX + c * colWidth;
        eCtx.strokeStyle = (c === 0 || c === 4) ? '#555' : '#333';
        eCtx.beginPath();
        eCtx.moveTo(x, 0);
        eCtx.lineTo(x, eCanvas.height);
        eCtx.stroke();
      }

      // Re-use gameplay notes in chart
      for (let i = 0; i < notes.length; i++) {
        const n = notes[i];
        const noteY = (n.time / 10) - editorScrollY;

        if (noteY > -50 && noteY < eCanvas.height + 50) {
          const x = startX + n.dir * colWidth + 5;
          const capitalizedDir = DIRECTIONS[n.dir].charAt(0).toUpperCase() + DIRECTIONS[n.dir].slice(1);
          const frameName = `static${capitalizedDir}0001`;

          if (spriteImg.complete && spriteImg.naturalWidth > 0 && frames[frameName]) {
            drawSpriteFrame(eCtx, frameName, x - 20, noteY - 15, 0.35);
          } else {
            drawFallbackArrow(eCtx, n.dir, x, noteY, colWidth - 10, 'confirm');
          }
        }
      }

      // Playhead Marker
      const playheadY = (songTime / 10) - editorScrollY;
      eCtx.strokeStyle = '#ff0055';
      eCtx.lineWidth = 2;
      eCtx.beginPath();
      eCtx.moveTo(startX - 20, playheadY);
      eCtx.lineTo(startX + gridWidth + 20, playheadY);
      eCtx.stroke();
    }

    // --- MAIN GAME LOOP ---
    function loop(timestamp) {
      const delta = timestamp - lastTimestamp;
      lastTimestamp = timestamp;

      updateGame(delta);
      renderGame();
      renderEditor();

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    // --- INPUT HANDLING ---
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Digit7') {
        isEditorOpen = !isEditorOpen;
        const overlay = document.getElementById('editor-overlay');
        if (isEditorOpen) {
          overlay.classList.add('active');
        } else {
          overlay.classList.remove('active');
        }
        return;
      }

      if (isEditorOpen) {
        if (e.code === 'Space') {
          isPlaying = !isPlaying;
        }
        return;
      }

      const dir = KEY_MAP[e.code];
      if (dir !== undefined && !e.repeat) {
        // Hit Detection Logic
        let hitNote = false;
        for (let i = 0; i < notes.length; i++) {
          const n = notes[i];
          if (!n.hit && n.dir === dir) {
            const diff = Math.abs(n.time - songTime);
            if (diff < 140) {
              n.hit = true;
              hitNote = true;
              strumState[dir].anim = 'confirm';
              strumState[dir].timer = 150;
              break;
            }
          }
        }

        if (!hitNote) {
          strumState[dir].anim = 'press';
          strumState[dir].timer = 100;
          misses++;
          missDisplay.innerText = `MISSES: ${misses}`;
        }
      }
    });

    // --- EDITOR INTERACTION ---
    eCanvas.addEventListener('wheel', (e) => {
      if (!isEditorOpen) return;
      e.preventDefault();
      editorScrollY = Math.max(0, editorScrollY + e.deltaY * 0.5);
    });

    eCanvas.addEventListener('mousedown', (e) => {
      if (!isEditorOpen) return;

      const rect = eCanvas.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      const mouseY = e.clientY - rect.top;

      const gridWidth = 320;
      const colWidth = gridWidth / 4;
      const startX = (eCanvas.width - gridWidth) / 2;

      if (mouseX >= startX && mouseX <= startX + gridWidth) {
        const dir = Math.floor((mouseX - startX) / colWidth);
        const clickedTime = Math.round((mouseY + editorScrollY) * 10);

        if (e.button === 0) { // Left Click Add
          notes.push({ time: clickedTime, dir: dir, hit: false });
          notes.sort((a, b) => a.time - b.time);
        } else if (e.button === 2) { // Right Click Remove
          notes = notes.filter(n => !(n.dir === dir && Math.abs(n.time - clickedTime) < 150));
        }
      }
    });

    eCanvas.addEventListener('contextmenu', e => e.preventDefault());

    // --- FILE INPUT HANDLERS ---
    document.getElementById('img-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          spriteImg.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    document.getElementById('xml-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          parseAtlas(event.target.result);
        };
        reader.readAsText(file);
      }
    });

    document.getElementById('json-input').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            bpm = data.bpm || 120;
            scrollSpeed = data.scrollSpeed || 2.0;
            notes = data.notes.map(n => ({ ...n, hit: false }));
            document.getElementById('input-bpm').value = bpm;
            document.getElementById('input-scroll').value = scrollSpeed;
          } catch(err) {
            alert('Invalid Chart JSON');
          }
        };
        reader.readAsText(file);
      }
    });

    document.getElementById('btn-export').addEventListener('click', () => {
      const chartData = {
        bpm: bpm,
        scrollSpeed: scrollSpeed,
        notes: notes.map(n => ({ time: n.time, dir: n.dir }))
      };
      const blob = new Blob([JSON.stringify(chartData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'chart.json';
      a.click();
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      notes = [];
    });

    document.getElementById('btn-play').addEventListener('click', () => {
      isPlaying = !isPlaying;
    });

    document.getElementById('input-bpm').addEventListener('change', (e) => {
      bpm = parseFloat(e.target.value) || 120;
    });

    document.getElementById('input-scroll').addEventListener('change', (e) => {
      scrollSpeed = parseFloat(e.target.value) || 2.0;
    });
  </script>
</body>
</html>
